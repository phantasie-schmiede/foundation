name: CI

# Caller workflow for the shared extension CI (phantasie-schmiede/qa,
# .github/workflows/extension-ci.yml). This file is managed by `qa link`
# (composer post-install/update) and verified by `qa check` in the CI:
# keep it identical to the template in the psbits/qa package
# (Resources/CI/ci.yml), do not edit it by hand.

on:
  push:
    branches:
      - '*'
    tags:
      - '*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: CI
    uses: phantasie-schmiede/qa/.github/workflows/extension-ci.yml@main
    secrets: inherit
